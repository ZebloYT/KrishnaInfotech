<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 76" width="460" height="76" fill="none">
  <!-- Subtle Hexagonal Shield Mark -->
  <g transform="translate(4, 6)">
    <!-- Base Hexagon -->
    <polygon points="32,4 58,19 58,49 32,64 6,49 6,19" fill="#141120" stroke="#241f36" stroke-width="2" stroke-linejoin="round"/>
    <!-- Inner Accent Geometry -->
    <polygon points="32,12 50,22 50,45 32,55 14,45 14,22" fill="#1a172a" stroke="#7c3aed" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Central Node -->
    <circle cx="32" cy="34" r="5" fill="#7c3aed"/>
    <circle cx="32" cy="34" r="2.5" fill="#ffffff"/>
    
    <!-- Circuit Crosshairs -->
    <line x1="32" y1="12" x2="32" y2="24" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="32" y1="44" x2="32" y2="55" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="14" y1="34" x2="22" y2="34" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="42" y1="34" x2="50" y2="34" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <g transform="translate(80, 15)">
    <text x="0" y="26" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="700" font-size="24" letter-spacing="-0.02em" fill="#ffffff">
      KRISHNA <tspan fill="#a78bfa">INFOTECH</tspan>
    </text>
    
    <g transform="translate(0, 34)">
      <circle cx="4" cy="5" r="2.5" fill="#10b981"/>
      <text x="12" y="9" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" letter-spacing="0.1em" fill="#6e6782">
        THE TEAM OF EXPERTS · EST. 2009
      </text>
    </g>
  </g>
</svg>
